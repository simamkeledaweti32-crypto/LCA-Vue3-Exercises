<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cooking Masterclass Checkout</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans:serif; background: #f5f5f5; }
    header { background: #e67e22; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .cart-icon { background: white; color: #e67e22; padding: 8px 12px; border-radius: 20px; font-weight: bold; }
    .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    .courses { display: grid; grid-template-columns: repeat(auto-fill, minmax:250px, 1fr); gap: 15px; }
    .course-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba:0,0,0,0.1; }
    .course-card img { width: 100%; height: 150px; object-cover; }
    .course-info { padding: 15px; }
    .course-name { font-size: 1.1rem; margin-bottom: 5px; }
    .course-price { color: #e67e22; font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; }
    .add-btn { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .cart { background: white; padding: 20px; border-radius: 8px; height: fit-content; position: sticky; top: 20px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
    .qty-controls { display: flex; gap: 8px; align-items: center; }
    .qty-btn { width: 25px; height: 25px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 4px; }
    .remove-btn { color: #e74c3c; background: none; border: none; cursor: pointer; font-size: 0.9rem; }
    .total { margin-top: 20px; padding-top: 15px; border-top: 2px solid #333; font-size: 1.3rem; font-weight: bold; }
    .checkout-btn { width: 100%; padding: 12px; background: #e67e22; color: white; border: none; border-radius: 5px; margin-top: 10px; cursor: pointer; font-size: 1rem; }
    .empty-cart { text-align: center; color: #999; padding: 30px 0; }
    @media: (max-width: 800px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="src/main.js"></script>
</body>
</html>
